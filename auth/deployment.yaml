apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: parikshit1212/auth-service:v1
        ports:
        - containerPort: 5001
        env:
        - name: MONGO_URI
          value: mongodb://database:27017/shopdb
        - name: JWT_SECRET
          value: mysecretkey
