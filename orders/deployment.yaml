apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
      - name: orders-service
        image: parikshit1212/orders-service:v1
        ports:
        - containerPort: 5004
        env:
        - name: MONGO_URI
          value: mongodb://database:27017/shopdb
